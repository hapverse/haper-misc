<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haper - product size variants, final</title>
<style>
:root{--gl:#5BB78E;--gp:#2F8163;--ga:#257056;--gd:#20654E;--gdd:#215F49;--ink:#1F332B;--ink2:#5A7268;--ink3:#93A79C;--app:#F5FAF7;--hair:#E5EFE9;--mint:#E7F3EC;--chip:#E2F6EC;--addM:#E8A93A;--stepT:#F3C46A;--danger:#C9506C;--dsurf:#FDF1F3;--warn:#8A5A12;--saveS:#E2F6EC;--saveInk:#14867F;--scrim:rgba(20,40,32,.46)}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:#d9e4de;color:var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.hd,.pr{font-family:Quicksand,Poppins,system-ui,sans-serif}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button,.rst{border:1px solid #9bb7a9;background:#fff;border-radius:99px;padding:7px 16px;font:600 13px Poppins,sans-serif;cursor:pointer}
.tabs button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.phone{width:390px;height:780px;background:var(--app);border-radius:34px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(20,72,56,.35);border:6px solid #fff}
.scr{height:100%;overflow-y:auto;padding:14px 12px 100px}
.scr h2{font:700 17px Quicksand;padding:4px 4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:16px;padding:8px;border:1px solid var(--hair);display:flex;flex-direction:column;position:relative}
.well{height:104px;border-radius:12px;background:var(--mint);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.pack{width:46px;height:62px;border-radius:8px 8px 5px 5px;background:linear-gradient(#fff,#f1e6cf);border:1px solid #d9c9a5;display:flex;align-items:center;justify-content:center;font:700 9px Quicksand;color:#8a6a2b;text-align:center}
.nm{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:6px;min-height:32px}
.price{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.price small{font-size:10.5px;color:var(--ink3)}
.price b{font:800 15px Quicksand;color:var(--gp)}
.mrp{font-size:11px;color:var(--ink3);text-decoration:line-through}
.ctl{margin-top:6px;display:flex;flex-direction:column;align-items:flex-end;min-height:50px;justify-content:flex-end}
.cap{font-size:10px;color:var(--ink2);margin-top:2px;width:74px;text-align:center}
.cap.in{color:var(--saveInk);background:var(--chip);border-radius:6px}
.add{border:1.5px solid var(--addM);background:#fff;color:var(--addM);border-radius:12px;font:700 13px Poppins;width:74px;height:34px;cursor:pointer;transition:transform .1s}
.add:active{transform:scale(.94)}
.stp{display:inline-flex;align-items:center;background:linear-gradient(var(--stepT),var(--addM));border-radius:12px;height:34px;color:#fff;font:800 14px Quicksand;overflow:hidden}
.stp button{background:none;border:0;color:#fff;font:700 18px Poppins;width:28px;height:34px;cursor:pointer}
.stp button[disabled]{opacity:.4}.stp span{min-width:18px;text-align:center}
.dim{opacity:.5;filter:grayscale(1)}
.oos{font-size:10.5px;color:var(--danger);font-weight:600}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10}
.sheetw{position:absolute;left:0;right:0;bottom:0;z-index:11;display:flex;flex-direction:column;align-items:center;animation:u .25s cubic-bezier(.2,.8,.2,1)}
@keyframes u{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheetw{animation:none}}
.x{width:36px;height:36px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:16px;margin-bottom:10px;cursor:pointer}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;max-height:560px;display:flex;flex-direction:column}
.sheet h3{font:700 16px Quicksand;padding:18px 16px 8px}
.sh-b{overflow-y:auto;padding:4px 14px 20px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);min-height:72px}
.row:last-child{border:0}
.row .well{width:56px;height:56px;flex:none;padding-bottom:5px}
.row .pack{width:24px;height:32px;font-size:7px}
.row .mid{flex:1;min-width:0}.row .sz{font:600 14px Poppins}
.row .rt{width:86px;display:flex;justify-content:flex-end}
.u{font-size:10.5px;color:var(--ink2)}
.lowt{font-size:11px;color:var(--warn);font-weight:600}
.pill{background:var(--saveS);color:var(--saveInk);border-radius:6px;padding:0 5px;font-size:10px;font-weight:700}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:linear-gradient(var(--gl),var(--gp),var(--gdd));color:#fff;border-radius:99px;padding:8px 20px;font:700 13px Poppins;box-shadow:0 6px 16px rgba(32,101,78,.4);z-index:5;white-space:nowrap}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:12px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* detail */
.dimg{height:200px;background:var(--mint);display:flex;align-items:center;justify-content:center;margin:-14px -12px 0}
.dimg .pack{width:90px;height:120px;font-size:14px}
.cr{display:flex;gap:6px;margin:12px 4px 6px;flex-wrap:wrap}
.cr span{background:var(--mint);color:var(--ink2);border-radius:99px;padding:2px 10px;font-size:11px}
.ttl{font:700 18px Quicksand;padding:0 4px}
.lab{font:600 13px Poppins;padding:14px 4px 8px}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tiles.nofade{-webkit-mask-image:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:108px;scroll-snap-align:start;border:1.5px solid var(--hair);border-radius:14px;padding:10px;background:#fff;position:relative;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.tile.sel{border:2px solid var(--gp);background:var(--chip);padding:9.5px}
.tile .ck{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--gp);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center}
.tile.sel .ck{display:flex}
.tile .cnt{position:absolute;top:-6px;right:-4px;background:var(--addM);color:#fff;font:700 10px Poppins;border-radius:99px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.tile .s{font:600 13px Poppins}
.tile .p{font:800 15px Quicksand;color:var(--gp);margin-top:4px}
.tile .m{font-size:10.5px;color:var(--ink3);text-decoration:line-through;margin-left:3px;font-weight:400}
.tile .o{font-size:10.5px;font-weight:600;color:var(--saveInk)}
.tile.oo{opacity:.55}
.sk{background:linear-gradient(90deg,#e7efe9,#f4f8f5,#e7efe9);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.sbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--hair);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.sbar .l small{display:block;font-size:10.5px;color:var(--ink3)}
.cta{width:150px;height:48px;border-radius:16px;border:0;background:linear-gradient(var(--gl),var(--gp),var(--gdd));color:#fff;font:700 15px Poppins;cursor:pointer}
.cta[disabled]{background:var(--dsurf);color:var(--danger);cursor:not-allowed}
.stp.big{height:48px;width:150px;justify-content:space-between;border-radius:16px}.stp.big button{height:48px;width:48px}
.cl{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid var(--hair)}
.cl .well{width:46px;height:46px;flex:none;padding-bottom:3px}.cl .pack{width:20px;height:28px;font-size:6px}
.cl .mid{flex:1}.cl .mid small{display:block;font-size:11px;color:var(--ink3)}
.note{font-size:12px;color:var(--ink2);max-width:420px;text-align:center}
</style></head><body>
<h1 class="hd" style="font-size:20px">Size variants - final (Option B + size tiles)</h1>
<div class="tabs" id="tabs"></div>
<div id="stage" style="display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start"></div>
<script>
var S={sugar:{name:'Sugar',sizes:[
 {l:'500 g',p:40,m:45,per:'Rs 8 / 100 g',q:0,st:9},
 {l:'1 kg',p:75,m:90,per:'Rs 7.5 / 100 g',q:0,st:3},
 {l:'5 kg',p:355,m:420,per:'Rs 7.1 / 100 g',q:0,st:0}]},
 atta:{name:'Atta',sizes:[1,2,3,4,5,6,7,8].map(function(i){return{l:i*1+' kg',p:48*i-i*2,m:55*i,per:'Rs '+(4.6+i*0.01).toFixed(1)+' / 100 g',q:0,st:i==8?0:20}})}};
var G=S.sugar, tab='list', sheet=false, sel=1, toast='', loading=false, single=false, many=false;
function cur(){return many?S.atta:S.sugar}
function total(g){return g.sizes.reduce(function(a,s){return a+s.q},0)}
function lowest(g){var a=g.sizes.filter(function(s){return s.st>0}).map(function(s){return s.p});return a.length?Math.min.apply(null,a):null}
function off(s){return Math.round((s.m-s.p)/s.m*100)}
function pack(t){return '<div class="pack">'+t+'</div>'}
function cardH(g){
 var n=total(g),lo=lowest(g),k=g.sizes.length,out=lo===null;
 var ctl;
 if(out)ctl='<span class="oos">Out of stock</span>';
 else if(n==0)ctl='<button class="add" onclick="openS()" aria-label="Add '+g.name+', '+k+' options, from '+lo+' rupees">ADD</button><div class="cap">'+k+' options</div>';
 else ctl='<div class="stp"><button onclick="step(-1)" aria-label="Decrease">-</button><span>'+n+'</span><button onclick="step(1)" aria-label="Increase">+</button></div><div class="cap in">'+n+' in cart</div>';
 var same=g.sizes.every(function(s){return s.p==g.sizes[0].p});
 return '<div class="card'+(out?'':'')+'"><div class="well'+(out?' dim':'')+'">'+pack(g.name)+'</div><div class="nm">'+g.name+' (premium)</div><div class="price">'+(out?'':'<small>'+(same?'':'from')+'</small><b>Rs '+lo+'</b>')+'</div><div class="ctl">'+ctl+'</div></div>';
}
function other(){return '<div class="card"><div class="well">'+pack('Salt')+'</div><div class="nm">Iodised salt</div><div class="price"><b>Rs 28</b><span class="mrp">Rs 30</span></div><div class="ctl"><button class="add">ADD</button></div></div>'}
function rowsH(g){return g.sizes.map(function(s,i){
 var o=s.st<=0,low=s.st>0&&s.st<=3,r;
 if(o)r='<span class="oos" style="font-size:12px">Sold out</span>';
 else if(s.q==0)r='<button class="add" onclick="addS('+i+')">ADD</button>';
 else r='<div class="stp"><button onclick="chg('+i+',-1)">-</button><span>'+s.q+'</span><button onclick="chg('+i+',1)"'+(s.q>=Math.min(6,s.st)?' disabled':'')+'>+</button></div>';
 return '<div class="row'+(o?' dim':'')+'"><div class="well">'+pack(s.l)+'</div><div class="mid"><div class="sz">'+s.l+'</div><div class="price"><b>Rs '+s.p+'</b><span class="mrp">Rs '+s.m+'</span><span class="pill">'+off(s)+'% OFF</span></div><div class="u">'+s.per+'</div>'+(low?'<div class="lowt">Only '+s.st+' left</div>':'')+'</div><div class="rt">'+r+'</div></div>'}).join('')}
function listP(){var g=cur();var h='<div class="phone"><div class="scr" style="'+(sheet?'overflow:hidden':'')+'"><h2>Atta, Rice &amp; Sugar</h2><div class="grid">'+cardH(g)+other()+other()+other()+'</div></div>';
 if(total(g)>0&&!sheet)h+='<div class="bar">View cart - '+total(g)+' item'+(total(g)>1?'s':'')+'</div>';
 if(sheet)h+='<div class="scrim" onclick="closeS()"></div><div class="sheetw" role="dialog" aria-label="'+g.name+'"><button class="x" onclick="closeS()" aria-label="Close">x</button><div class="sheet"><h3>'+g.name+' (premium)</h3><div class="sh-b">'+rowsH(g)+'</div></div></div>';
 return h+'<div class="toast'+(toast?' on':'')+'">'+toast+'</div></div>'}
function tilesH(g){return g.sizes.map(function(s,i){var o=s.st<=0,low=s.st>0&&s.st<=3;
 return '<button class="tile'+(i==sel?' sel':'')+(o?' oo':'')+'" role="radio" aria-checked="'+(i==sel)+'" onclick="pick('+i+')"><span class="ck">&#10003;</span>'+(s.q?'<span class="cnt">'+s.q+'</span>':'')+'<div class="s">'+s.l+'</div><div class="p">Rs '+s.p+'<span class="m">Rs '+s.m+'</span></div>'+(o?'<div class="o" style="color:var(--danger)">Sold out</div>':'<div class="o">'+off(s)+'% OFF on MRP</div>')+'<div class="u">'+s.per+'</div>'+(low?'<div class="lowt" style="font-size:10.5px">Only '+s.st+' left</div>':'')+'</button>'}).join('')}
function detailP(){var g=cur();
 if(loading)return '<div class="phone"><div class="scr"><div class="dimg sk" style="border-radius:0"></div><div class="sk" style="height:22px;width:60%;margin:16px 4px"></div><div class="sk" style="height:14px;width:30%;margin:0 4px 12px"></div><div style="display:flex;gap:8px;padding:0 4px"><div class="sk" style="width:108px;height:92px"></div><div class="sk" style="width:108px;height:92px"></div><div class="sk" style="width:108px;height:92px"></div></div></div><div class="sbar"><div class="sk" style="width:110px;height:36px"></div><div class="sk" style="width:150px;height:48px"></div></div></div>';
 var s=g.sizes[sel],o=s.st<=0;
 var body=single?'':'<div class="lab" id="lbl">Select Unit</div><div class="tiles'+(g.sizes.length<=3?' nofade':'')+'" role="radiogroup" aria-labelledby="lbl">'+tilesH(g)+'</div>';
 var btn=o?'<button class="cta" disabled>Sold out</button>':s.q==0?'<button class="cta" onclick="dadd()">Add to cart</button>':'<div class="stp big"><button onclick="dchg(-1)">-</button><span>'+s.q+'</span><button onclick="dchg(1)"'+(s.q>=Math.min(6,s.st)?' disabled':'')+'>+</button></div>';
 return '<div class="phone"><div class="scr"><div class="dimg">'+pack(g.name)+'</div><div class="cr"><span>Brand: Madhur</span><span>Veg</span><span>Refined</span></div><div class="ttl">'+g.name+' (premium)</div><div class="u" style="padding:2px 4px">'+(single?'1 kg':s.l)+' &middot; '+s.per+'</div>'+body+(o?'<div class="u" style="padding:4px;color:var(--danger)">This size is sold out. Pick another size.</div>':'')+'<div class="u" style="padding:14px 4px">Delivery in 10-15 min. Free from additives. Store in a cool, dry place.</div></div><div class="sbar"><div class="l"><div class="u">'+s.l+'</div><div class="price"><b style="font-size:18px;'+(o?'color:var(--ink3)':'')+'">Rs '+s.p+'</b><span class="mrp">Rs '+s.m+'</span></div><small>Inclusive of all taxes</small></div>'+btn+'</div><div class="toast'+(toast?' on':'')+'">'+toast+'</div></div>'}
function cartP(){var g=S.sugar,ls=g.sizes.filter(function(s){return s.q>0});
 var h='<div class="phone"><div class="scr"><h2>Cart</h2>';
 if(!ls.length)h+='<p class="u" style="padding:20px">Cart is empty. Add sizes from the list tab.</p>';
 ls.forEach(function(s,i){var j=g.sizes.indexOf(s);h+='<div class="cl"><div class="well">'+pack(s.l)+'</div><div class="mid"><b style="font-size:13px">Sugar (premium)</b><small>'+s.l+(s.st<=3?' <span class="lowt">Only '+s.st+' left</span>':'')+'</small></div><div style="text-align:right"><div class="stp"><button onclick="cc('+j+',-1)">-</button><span>'+s.q+'</span><button onclick="cc('+j+',1)">+</button></div><div class="price" style="justify-content:flex-end"><b>Rs '+s.p*s.q+'</b><span class="mrp">Rs '+s.m*s.q+'</span></div></div></div>'});
 return h+'</div></div>'}
function setT(t){tab=t;render()}
function openS(){sheet=true;render()}function closeS(){sheet=false;render()}
function step(d){var g=cur(),ls=g.sizes.filter(function(s){return s.q>0});if(ls.length>1){openS();return}var s=ls[0];s.q=Math.max(0,s.q+d);render()}
function addS(i){cur().sizes[i].q=1;render()}
function chg(i,d){var s=cur().sizes[i];var mx=Math.min(6,s.st);if(d>0&&s.q>=mx){flash(s.st<6?'Only '+s.st+' available':'Max 6 per order');return}s.q=Math.max(0,s.q+d);render()}
function pick(i){sel=i;render()}
function dadd(){cur().sizes[sel].q=1;render()}
function dchg(d){chg(sel,d)}
function cc(i,d){chg(i,d)}
function flash(m){toast=m;render();setTimeout(function(){toast='';render()},1600)}
function reset(){S.sugar.sizes.forEach(function(s){s.q=0});S.atta.sizes.forEach(function(s){s.q=0});sheet=false;sel=1;render()}
function tg(k){if(k=='loading')loading=!loading;if(k=='single')single=!single;if(k=='many'){many=!many;sel=0}render()}
function render(){
 var tabs=[['list','List card + sheet'],['detail','Detail + tiles'],['cart','Cart lines']];
 document.getElementById('tabs').innerHTML=tabs.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="setT(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'<button class="rst" onclick="tg(\'many\')">'+(many?'Showing 8 sizes':'Switch to 8 sizes (Atta, 8 is sold out)')+'</button><button class="rst" onclick="tg(\'loading\')">Toggle loading</button><button class="rst" onclick="tg(\'single\')">Toggle single size</button><button class="rst" onclick="reset()">Reset</button>';
 document.getElementById('stage').innerHTML=(tab=='list'?listP():tab=='detail'?detailP():cartP())+'<div class="note">'+({list:'Card shows "from Rs X" (lowest in-stock) and an "N options" caption. ADD opens the sheet. Add two sizes, close, then tap +/- on the card: it reopens the sheet. 500 g has a stepper cap; 1 kg is low stock; 5 kg is sold out (greyed, no Notify me).',detail:'Tap tiles to switch size. Sticky bar follows the selected tile; Add to cart becomes a stepper. Try the 8-size and single-size toggles; the 8-size row scrolls with a fade hint.',cart:'One line per size, sorted by size.'})[tab]+'</div>';
 var sc=document.querySelector('.tiles');if(sc){var t=sc.querySelector('.sel');if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',inline:'nearest'})}
}
render();
</script></body></html>
