<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haper - product variants (Zepto/Blinkit-style) mockup</title>
<style>
:root{--GreenLeaf:#5BB78E;--GreenPrice:#2F8163;--GreenAction:#257056;--GreenDeep:#20654E;--GreenDeepest:#215F49;--GreenMint:#84D2AC;--GreenMid:#3D9574;
--ink:#1F332B;--ink2:#5A7268;--ink3:#93A79C;--app:#F5FAF7;--white:#fff;--chip:#E2F6EC;--hair:#E5EFE9;--mint:#E7F3EC;--ring:rgba(88,169,132,.14);
--danger:#DC5F78;--dangerS:#FDF1F3;--dangerDeep:#C9506C;--warn:#C98A2E;--warnS:#FBF0DC;--warnText:#8A5A12;--saveS:#FDF0E3;--saveInk:#A85212;
--addT:#FFC48A;--addM:#E58124;--addD:#C2691A;--stepT:#F7B569;--scrim:rgba(16,44,36,.46);--teal:#14867F;--skel:#EEF6F1;--skelH:#E2F0E8}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:#d9e4de;color:var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.hd,.price,.big{font-family:Quicksand,Poppins,system-ui,sans-serif}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:640px}
.tabs button{border:1px solid #9bb7a9;background:#fff;border-radius:99px;padding:6px 12px;font:600 12px Poppins,sans-serif;cursor:pointer}
.tabs button.on{background:var(--GreenDeep);color:#fff;border-color:var(--GreenDeep)}
.phone{width:390px;height:780px;background:var(--app);border-radius:34px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(20,72,56,.35);border:8px solid #1f332b}
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:90px}
.top{background:linear-gradient(160deg,var(--GreenMint),var(--GreenMid) 46%,var(--GreenDeep));color:#fff;padding:18px 16px 14px}
.top h1{font-size:19px;font-weight:700}.top small{opacity:.85;font-size:12px}
.back{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;margin-right:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:#fff;border-radius:25px;padding:12px;box-shadow:0 4px 14px rgba(22,74,58,.08);cursor:pointer;position:relative}
.well{height:102px;border-radius:20px;border:1px solid var(--ring);position:relative;display:flex;align-items:center;justify-content:center;font-size:40px;background:#fff}
.off{position:absolute;top:0;right:0;border-radius:0 20px 0 12px;background:linear-gradient(135deg,var(--GreenLeaf),var(--GreenPrice) 60%,var(--GreenDeepest));color:#fff;font-size:10px;font-weight:800;padding:4px 8px}
.veg{position:absolute;top:6px;left:6px;width:14px;height:14px;border:1.6px solid #15803D;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center}
.veg i{width:5px;height:5px;border-radius:50%;background:#15803D}
.add{position:absolute;right:4px;bottom:-12px;width:34px;height:34px;border-radius:14px;border:0;color:#fff;font-size:22px;line-height:1;background:linear-gradient(150deg,var(--addT),var(--addM),var(--addD));box-shadow:0 4px 8px rgba(194,105,26,.35);cursor:pointer}
.step{position:absolute;right:4px;bottom:-12px;display:flex;align-items:center;background:linear-gradient(150deg,var(--stepT),var(--addM));border-radius:14px;color:#fff;box-shadow:0 4px 8px rgba(194,105,26,.35)}
.step button{width:26px;height:32px;border:0;background:none;color:#fff;font-size:17px;cursor:pointer}
.step b{font-size:12.5px;min-width:14px;text-align:center}
.nm{margin-top:25px;font-size:12.5px;font-weight:500;line-height:1.25;min-height:31px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pack{margin-top:4px;font-size:11px;color:var(--ink3)}
.opt{display:inline-flex;align-items:center;gap:3px;margin-top:4px;border:1px solid var(--GreenLeaf);background:var(--mint);color:var(--GreenAction);border-radius:99px;padding:3px 9px;font:600 11px Poppins,sans-serif;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
.price{font-weight:800;color:var(--GreenPrice);font-size:15px}.mrp{font-size:11px;color:var(--ink3);text-decoration:line-through;margin-left:5px;font-weight:500}
.ch{font-size:9.5px;font-weight:700;border-radius:8px;padding:2px 6px;white-space:nowrap}
.ch.save{background:var(--saveS);color:var(--saveInk)}.ch.low{background:var(--warnS);color:var(--warn)}.ch.oos{background:var(--dangerS);color:var(--danger)}.ch.cart{background:var(--chip);color:var(--GreenDeep)}
.card.dim .well{opacity:.45;filter:grayscale(1)}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:78%;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(14,56,44,.3)}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:8px auto}
.sh{display:flex;gap:10px;align-items:center;padding:4px 16px 10px;border-bottom:1px solid var(--hair)}
.sh .t{width:44px;height:44px;border-radius:14px;border:1px solid var(--ring);display:flex;align-items:center;justify-content:center;font-size:24px}
.sh h3{font-size:15px;font-weight:700;flex:1}.x{border:0;background:var(--mint);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink2)}
.vr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.vr .l{flex:1}.vr .sz{font-weight:600;font-size:14px}.vr .u{font-size:11px;color:var(--ink3)}
.vr.oos .sz,.vr.oos .price{color:var(--ink3)}
.vr .ctl{position:relative;width:86px;height:34px;flex:none}
.vr .ctl .add,.vr .ctl .step{position:absolute;right:0;bottom:0}
.addw{width:74px;height:34px;border-radius:12px;border:1.5px solid var(--addM);background:#fff;color:var(--addM);font:700 13px Poppins,sans-serif;cursor:pointer;position:absolute;right:0}
.nfy{border:1px solid var(--hair);background:var(--mint);color:var(--GreenAction);border-radius:12px;padding:6px 8px;font:600 11px Poppins;position:absolute;right:0;height:34px;cursor:pointer}
.foot{padding:10px 16px 16px}
.cta{width:100%;height:46px;border:0;border-radius:16px;color:#fff;font:700 14px Poppins;background:linear-gradient(135deg,var(--GreenLeaf),var(--GreenPrice) 60%,var(--GreenDeepest));cursor:pointer}
.bar{position:absolute;left:12px;right:12px;bottom:14px;height:52px;border-radius:18px;background:linear-gradient(90deg,#1E3A30,#2F6250);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .2s}
.bar em{font-style:normal;color:#FFD9AE;font-weight:700}
.tiles{display:flex;gap:8px;padding:0 16px;overflow-x:auto}
.tile{flex:none;min-width:92px;border:1.5px solid var(--hair);background:#fff;border-radius:16px;padding:8px 10px;cursor:pointer;position:relative;text-align:center}
.tile.sel{border-color:var(--GreenPrice);background:var(--chip)}
.tile.o{opacity:.55}.tile .sz{font-weight:600;font-size:13px}.tile .price{font-size:14px}.tile .m{font-size:10.5px;color:var(--ink3);text-decoration:line-through}
.tile .tg{position:absolute;top:-8px;left:8px;background:var(--GreenPrice);color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:1px 5px}
.tile .tg.o{background:var(--danger)}
.dh{height:170px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:84px}
.pad{padding:12px 16px}
.cl{background:#fff;border-radius:20px;margin:12px 14px;padding:4px 14px}
.cr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--hair)}.cr:last-child{border:0}
.cr .t{width:46px;height:46px;border-radius:14px;border:1px solid var(--ring);display:flex;align-items:center;justify-content:center;font-size:24px}
.cr .l{flex:1;font-size:12.5px;font-weight:500}.cr .l small{display:block;color:var(--ink3);font-size:11px}
.cr .step{position:static}
.sk{background:linear-gradient(90deg,var(--skel) 25%,var(--skelH) 50%,var(--skel) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.sheet,.scrim{transition:none}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.note{max-width:420px;font-size:12px;color:#2c4339;text-align:center}
</style></head><body>
<div class="tabs" id="tabs"></div>
<div class="phone" id="phone"></div>
<p class="note" id="note"></p>
<script>
"use strict";
var P={
 sugar:{id:'sugar',name:'Madhur Pure Sugar',em:'🧂',veg:1,vars:[
  {id:'s500',size:'500 g',sp:33,mrp:50,stock:28,lowQty:5},
  {id:'s1k',size:'1 kg',sp:65,mrp:80,stock:12,lowQty:5},
  {id:'s2k',size:'2 kg',sp:128,mrp:158,stock:0,lowQty:5}]},
 atta:{id:'atta',name:'Fortune Chakki Fresh Atta',em:'🌾',veg:1,vars:[
  {id:'a5',size:'5 kg',sp:240,mrp:258,stock:2,lowQty:5},
  {id:'a10',size:'10 kg',sp:469,mrp:505,stock:9,lowQty:5}]},
 milk:{id:'milk',name:'Amul Gold Full Cream Milk',em:'🥛',veg:1,vars:[{id:'m5',size:'500 ml',sp:34,mrp:34,stock:40,lowQty:5}]},
 besan:{id:'besan',name:'Tata Sampann Besan',em:'🥣',veg:1,vars:[{id:'b1',size:'1 kg',sp:98,mrp:112,stock:0,lowQty:5}]}
};
var CAP=6, cart={}, view='list', sheet=null, detailSel={}, loading=false, tab='list';
function find(v){for(var k in P){for(var i=0;i<P[k].vars.length;i++){if(P[k].vars[i].id===v)return{p:P[k],v:P[k].vars[i]};}}return null;}
function q(v){return cart[v]||0;}
function pq(p){return p.vars.reduce(function(a,v){return a+q(v.id);},0);}
function lines(p){return p.vars.filter(function(v){return q(v.id)>0;}).length;}
function oos(v){return v.stock<=0;}
function allOos(p){return p.vars.every(oos);}
function dflt(p){return p.vars.filter(function(v){return !oos(v);})[0]||p.vars[0];}
function low(v){return !oos(v)&&v.stock<=v.lowQty;}
function cap(v){return Math.min(CAP,v.stock);}
function pct(v){return v.mrp>v.sp?Math.round((v.mrp-v.sp)/v.mrp*100):0;}
function toast(t){var e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on');},1400);}
function inc(id){var f=find(id);if(!f||oos(f.v))return;if(q(id)>=cap(f.v)){toast(f.v.stock<CAP?'Only '+f.v.stock+' available':'Max '+CAP+' per order');return;}cart[id]=q(id)+1;render();}
function dec(id){if(q(id)>0){cart[id]=q(id)-1;if(!cart[id])delete cart[id];render();}}
function openSheet(pid){sheet=pid;render(true);}
function closeSheet(){sheet=null;render();}
function go(v){view=v;sheet=null;render();}
function cartTotals(){var n=0,s=0,m=0;for(var id in cart){var f=find(id);n+=cart[id];s+=cart[id]*f.v.sp;m+=cart[id]*f.v.mrp;}return{n:n,s:s,m:m};}

function ctlCard(p){
 var d=dflt(p), multi=p.vars.length>1, n=pq(p);
 if(allOos(p))return '';
 if(n>0){var multiLn=lines(p)>1, dc=multiLn?"openSheet('"+p.id+"')":"dec('"+curLine(p)+"')", ic=multiLn?"openSheet('"+p.id+"')":"inc('"+curLine(p)+"')";
  return '<div class="step" onclick="event.stopPropagation()"><button aria-label="Decrease" onclick="'+dc+'">\u2212</button><b>'+n+'</b><button aria-label="Increase" onclick="'+ic+'">+</button></div>';}
 return '<button class="add" aria-label="Add '+p.name+' '+d.size+'" onclick="event.stopPropagation();'+(multi?"openSheet('"+p.id+"')":"inc('"+d.id+"')")+'">+</button>';
}
function curLine(p){return p.vars.filter(function(v){return q(v.id)>0;})[0].id;}
function card(p){
 var d=dflt(p), multi=p.vars.length>1, ao=allOos(p), n=pq(p), pc=pct(d);
 var chip=ao?'<span class="ch oos">Out of stock</span>':low(d)&&!multi?'<span class="ch low">Only '+d.stock+' left</span>':n>0?'<span class="ch cart">'+n+' in cart</span>':(d.mrp>d.sp?'<span class="ch save">SAVE ₹'+(d.mrp-d.sp)+'</span>':'');
 var sizeRow=multi&&!ao?'<button class="opt" onclick="event.stopPropagation();openSheet(\''+p.id+'\')" aria-label="'+p.vars.length+' sizes, choose size">'+p.vars.length+' sizes ▾</button>':'<div class="pack">'+d.size+'</div>';
 return '<div class="card'+(ao?' dim':'')+'" onclick="openDetail(\''+p.id+'\')"><div class="well">'+p.em+(pc&&!ao?'<span class="off">'+pc+'% OFF</span>':'')+(p.veg?'<span class="veg"><i></i></span>':'')+ctlCard(p)+'</div>'
 +'<div class="nm">'+p.name+'</div>'+sizeRow
 +'<div class="row"><div>'+(multi&&!ao?'<span style="font-size:10.5px;color:var(--ink3);font-weight:500">from </span>':'')+'<span class="price">₹'+d.sp+'</span>'+(d.mrp>d.sp?'<span class="mrp">₹'+d.mrp+'</span>':'')+'</div>'+chip+'</div></div>';
}
function skCard(){return '<div class="card"><div class="sk" style="height:102px;border-radius:20px"></div><div class="sk" style="height:12px;margin-top:25px;width:90%"></div><div class="sk" style="height:12px;margin-top:8px;width:50%"></div><div class="sk" style="height:16px;margin-top:10px;width:40%"></div></div>';}
function bar(){var t=cartTotals();if(!t.n)return '';return '<div class="bar" onclick="go(\'cart\')"><span>'+t.n+' item'+(t.n>1?'s':'')+'</span><span>View cart · <em>₹'+t.s+'</em> ›</span></div>';}

function sheetHtml(){
 var p=sheet?P[sheet]:null; if(!p)return '<div class="sheet"></div>';
 var rows=p.vars.map(function(v){
  var n=q(v.id), pc=pct(v), o=oos(v);
  var ctl=o?'<button class="nfy" onclick="toast(\'We will tell you when it is back\')">Notify me</button>':n>0?'<div class="step"><button aria-label="Decrease '+v.size+'" onclick="dec(\''+v.id+'\')">−</button><b>'+n+'</b><button aria-label="Increase '+v.size+'" onclick="inc(\''+v.id+'\')">+</button></div>':'<button class="addw" aria-label="Add '+v.size+'" onclick="inc(\''+v.id+'\')">ADD</button>';
  return '<div class="vr'+(o?' oos':'')+'"><div class="l"><div class="sz">'+v.size+'</div><div><span class="price">₹'+v.sp+'</span>'+(v.mrp>v.sp?'<span class="mrp">₹'+v.mrp+'</span>':'')+(pc?' <span class="ch save">'+pc+'% OFF</span>':'')+'</div>'+(o?'<div class="u" style="color:var(--danger)">Out of stock</div>':low(v)?'<div class="u" style="color:var(--warnText)">Only '+v.stock+' left</div>':'')+'</div><div class="ctl">'+ctl+'</div></div>';
 }).join('');
 var t=cartTotals(), n=pq(p);
 return '<div class="sheet on" role="dialog" aria-label="Choose size for '+p.name+'"><div class="grab"></div><div class="sh"><div class="t">'+p.em+'</div><h3 class="hd">'+p.name+'</h3><button class="x" aria-label="Close" onclick="closeSheet()">✕</button></div><div style="overflow-y:auto">'+rows+'</div><div class="foot">'+(n>0?'<button class="cta" onclick="closeSheet()">Done · '+n+' in cart</button>':'<button class="cta" style="background:var(--mint);color:var(--ink3);cursor:default" disabled>Pick a size to add</button>')+'</div></div>';
}
function openDetail(pid){detailSel.cur=pid;view='detail';sheet=null;render();}

function listScreen(){
 var items=[P.sugar,P.atta,P.milk,P.besan];
 return '<div class="scr"><div class="top"><h1 class="hd">Staples</h1><small>Sugar, atta & more</small></div><div class="grid">'+(loading?skCard()+skCard()+skCard()+skCard():items.map(card).join(''))+'</div></div>'+bar();
}
function detailScreen(){
 var p=P[detailSel.cur]||P.sugar; var sel=detailSel[p.id]||dflt(p).id; var f=find(sel), v=f.v, n=q(v.id);
 var tiles=p.vars.map(function(x){var o=oos(x);return '<div class="tile'+(x.id===sel?' sel':'')+(o?' o':'')+'" role="radio" aria-checked="'+(x.id===sel)+'" tabindex="0" onclick="detailSel[\''+p.id+'\']=\''+x.id+'\';render()">'+(o?'<span class="tg o">OUT</span>':pct(x)?'<span class="tg">'+pct(x)+'% OFF</span>':'')+(q(x.id)?'<span class="tg" style="left:auto;right:8px;background:var(--addM)">'+q(x.id)+'</span>':'')+'<div class="sz">'+x.size+'</div><div class="price">₹'+x.sp+'</div>'+(x.mrp>x.sp?'<div class="m">₹'+x.mrp+'</div>':'')+'</div>';}).join('');
 var cta=oos(v)?'<button class="cta" style="background:var(--dangerS);color:var(--dangerDeep)" disabled>Out of stock · pick another size</button>':n>0?'<div style="display:flex;align-items:center;justify-content:space-between"><div class="step" style="position:static;height:46px;border-radius:16px;width:140px;justify-content:space-between"><button style="height:46px;width:46px" onclick="dec(\''+v.id+'\')">−</button><b style="font-size:15px">'+n+'</b><button style="height:46px;width:46px" onclick="inc(\''+v.id+'\')">+</button></div><span class="price" style="font-size:16px">₹'+(n*v.sp)+'</span></div>':'<button class="cta" style="background:linear-gradient(150deg,#FFC48A,#EE8B33 52%,#C2691A)" onclick="inc(\''+v.id+'\')">Add to cart · ₹'+v.sp+'</button>';
 return '<div class="scr"><div class="top" style="padding-bottom:10px"><button class="back" onclick="go(\'list\')" aria-label="Back">‹</button><b class="hd">Product details</b></div><div class="dh">'+p.em+'</div><div class="pad"><h2 class="hd" style="font-size:18px">'+p.name+'</h2><div style="margin-top:4px;font-size:12px;color:var(--ink3)">'+v.size+' · ₹'+(v.sp/(/kg/.test(v.size)?parseFloat(v.size):parseFloat(v.size)/1000)).toFixed(0)+' / kg'+'</div></div>'
 +'<div class="pad" style="padding-bottom:4px;font-weight:600;font-size:13px">Select size</div><div class="tiles" role="radiogroup" aria-label="Size" style="padding-top:10px">'+tiles+'</div>'
 +'<div class="pad"><span class="price" style="font-size:22px">₹'+v.sp+'</span>'+(v.mrp>v.sp?'<span class="mrp" style="font-size:13px">₹'+v.mrp+'</span> <span class="ch save">'+pct(v)+'% OFF</span>':'')+(low(v)?' <span class="ch low">Only '+v.stock+' left</span>':'')+'<div style="font-size:11px;color:var(--ink3);margin-top:2px">Inclusive of all taxes</div></div></div>'
 +'<div style="position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px 18px;box-shadow:0 -6px 20px rgba(14,56,44,.1)">'+cta+'</div>';
}
function cartScreen(){
 var ids=Object.keys(cart), t=cartTotals();
 if(!ids.length)return '<div class="scr"><div class="top"><button class="back" onclick="go(\'list\')">‹</button><b class="hd">Cart</b></div><div style="text-align:center;padding:80px 30px;color:var(--ink2)"><div style="font-size:48px">🛒</div><p class="hd" style="font-weight:700;margin:8px 0">Your cart is empty</p><p style="font-size:12px">Add a size from the list.</p></div></div>';
 var rows=ids.map(function(id){var f=find(id),v=f.v;return '<div class="cr"><div class="t">'+f.p.em+'</div><div class="l">'+f.p.name+'<small>'+v.size+(low(v)?' · Only '+v.stock+' left':'')+'</small></div><div class="step"><button aria-label="Decrease" onclick="dec(\''+id+'\')">−</button><b>'+cart[id]+'</b><button aria-label="Increase" onclick="inc(\''+id+'\')">+</button></div><div style="text-align:right;min-width:52px"><div class="price">₹'+(v.sp*cart[id])+'</div>'+(v.mrp>v.sp?'<div class="mrp" style="margin:0">₹'+(v.mrp*cart[id])+'</div>':'')+'</div></div>';}).join('');
 return '<div class="scr"><div class="top"><button class="back" onclick="go(\'list\')">‹</button><b class="hd">Cart</b></div><div class="cl">'+rows+'</div><div class="cl" style="padding:12px 14px;font-size:13px"><div style="display:flex;justify-content:space-between"><span>Item total</span><span>₹'+t.m+'</span></div><div style="display:flex;justify-content:space-between;color:var(--teal)"><span>Discount</span><span>−₹'+(t.m-t.s)+'</span></div><div class="hd" style="display:flex;justify-content:space-between;font-weight:800;margin-top:6px"><span>To pay</span><span>₹'+t.s+'</span></div></div></div><div style="position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px 18px"><button class="cta">Proceed to pay · ₹'+t.s+'</button></div>';
}
function render(animate){
 var ph=document.getElementById('phone'); var body=view==='list'?listScreen():view==='detail'?detailScreen():cartScreen();
 var keep=ph.firstChild&&ph.firstChild.scrollTop||0;

var TABS=[['list','List + sheet'],['atta','Atta (low stock)'],['detail','Detail tiles'],['cart','Cart (2 sizes)'],['oos','Out of stock'],['load','Loading']];
var NOTES={list:'Tap "3 sizes" or + on Sugar to open the sheet. Add sizes; card count and cart bar update live.',atta:'Atta 5 kg has only 2 left: stepper stops at 2 with a toast.',detail:'Detail page: size tiles (size + price + discount tag); OUT tile is dimmed but selectable.',cart:'Each size is its own line with its own stepper.',oos:'Sheet row 2 kg is OUT OF STOCK (Notify me). Besan on the list is fully out of stock.',load:'Skeleton cards, same footprint as ProductCard.'};
function setTab(t){tab=t;loading=false;sheet=null;
 if(t==='list'){cart={};view='list';}
 if(t==='atta'){cart={};view='list';sheet='atta';}
 if(t==='detail'){cart={};detailSel={cur:'sugar'};view='detail';}
 if(t==='cart'){cart={s500:1,s1k:2};view='cart';}
 if(t==='oos'){cart={};view='list';sheet='sugar';}
 if(t==='load'){cart={};view='list';loading=true;}
 document.getElementById('note').textContent=NOTES[t];
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});
 render();}
(function(){var el=document.getElementById('tabs');TABS.forEach(function(x){var b=document.createElement('button');b.textContent=x[1];b.dataset.t=x[0];b.onclick=function(){setTab(x[0]);};el.appendChild(b);});setTab('list');})();
</script></body></html>
